# La construction SANS_BARRIERE : l'app et les widgets, sans les extensions Temps d'écran ni
# l'entitlement Family Controls. Pour TestFlight tant qu'Apple n'a pas accordé l'entitlement de
# distribution (décision D3, ROADMAP.md tâche 19). Voir projet-commun.yml.

include:
  - projet-commun.yml

targets:
  MyHitbodedut:
    templates: [App]
    dependencies:
      - package: Coeur
        products:
          - Coeur
          - Ecrans
          - Vues
          # L'état de Temps d'écran que l'app constate (Constat), pour les adaptateurs d'App/Services.
          - Barriere
      # Lié explicitement : sans lui, l'extraction des métadonnées d'AppIntents est sautée, et l'action « Terminer
      # maintenant » de la Live Activity (TerminerSeanceIntent) ne serait pas trouvée.
      - sdk: AppIntents.framework
      - target: Widgets
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SANS_BARRIERE
    entitlements:
      path: App/MyHitbodedut-SansBarriere.entitlements
      properties:
        com.apple.security.application-groups: [group.com.myhitbodedut]
