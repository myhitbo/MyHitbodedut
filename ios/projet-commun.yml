# Partie commune aux deux projets engendrés par XcodeGen 2.46.0 (PORTAGE.md § 5.3, § 7.1) :
#   project.yml                → l'app, les widgets et les trois extensions de la barrière ;
#   project-sans-barriere.yml  → l'app et les widgets seuls, pour TestFlight tant qu'Apple n'a pas
#                                accordé Family Controls en distribution (décision D3).
# Le projet Xcode n'est jamais versionné : xcodegen generate --spec project.yml

name: MyHitbodedut

options:
  bundleIdPrefix: com.myhitbodedut
  deploymentTarget:
    iOS: "26.5"          # décision D2
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone et iPad (tâche 29 : les marges des grands écrans, GrandEcran)
    DEVELOPMENT_TEAM: ""          # posé par la signature (Codemagic, P1 et P2)
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Coeur:
    path: Paquets/Coeur

targetTemplates:
  App:
    type: application
    platform: iOS
    sources:
      - App
      # Ce que l'app partage avec l'extension des widgets : le dossier du groupe, les attributs de la Live Activity
      # et l'action « Terminer maintenant » (Widgets/Commun, compilé dans les deux cibles).
      - Widgets/Commun
      # Les ressources exportées par tools/export_contenu (PORTAGE.md § 4.2), en dossiers : le paquet de l'app
      # garde leur arborescence (Contenu/livres/<id>/…, Images/<nom>.webp, Polices/licences/…).
      - path: Ressources/Contenu
        type: folder
      - path: Ressources/Images
        type: folder
      - path: Ressources/Polices
        type: folder
      - path: Ressources/Musique
        type: folder
      # Les catalogues de chaînes, compilés pour Text("clé") ; XcodeGen y lit les langues du projet (knownRegions).
      # Catalogue/ tient les copies qu'Xcode accepte, écrites par export.py : celle du catalogue d'Android
      # (Localizable) et celle des chaînes propres à iOS (ios, écrites à la main sous Chaines/), l'arabe y étant
      # régional (« ar-TN ») : l'app ne se déclare au système qu'en derja de Tunisie (LangueApp.livree).
      - path: Ressources/Catalogue
        includes: ["*.xcstrings"]
      # Les mêmes fichiers tels quels, sous Chaines/ : le Traducteur d'Ecrans lit le JSON du catalogue, les
      # écrans les tableaux de chaînes (Tableaux.json).
      - path: Ressources/Chaines
        type: folder
    # Le test d'interface de l'audit d'accessibilité (tâche 29), lancé par ios-captures.yml seulement.
    scheme:
      testTargets: [MyHitbodedutUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myhitbodedut
        PRODUCT_NAME: MyHitbodedut
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MyHitbodedut
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # La position du téléphone (PORTAGE.md § 2.2.5) : approximative par défaut, comme ACCESS_COARSE_LOCATION ;
        # précise pour une fois au relevé GPS du vol. Les phrases sont traduites dans Chaines/InfoPlist.xcstrings.
        NSLocationWhenInUseUsageDescription: "Your location is only used for zmanim, the direction of Jerusalem and, in flight, the times below the plane. It stays on the device."
        NSLocationDefaultAccuracyReduced: true
        NSLocationTemporaryUsageDescriptionDictionary:
          vol: "A precise GPS fix realigns the plane's route and the in-flight zmanim."
        # La séance sur l'écran verrouillé et dans l'île dynamique (tâche 17).
        NSSupportsLiveActivities: true
        # Les adresses des widgets, de la Live Activity et des notifications (LienApp).
        CFBundleURLTypes:
          - CFBundleURLName: com.myhitbodedut
            CFBundleURLSchemes: [myhitbodedut]
        # Le rafraîchissement d'arrière-plan qui replanifie les notifications (ReplanificationFond, tâche 19).
        BGTaskSchedulerPermittedIdentifiers: [com.myhitbodedut.replanifier]
        UIBackgroundModes: [fetch]
        # Toutes les orientations, comme Android (aucun screenOrientation, layout-land) ; l'iPad les quatre, pour le
        # partage d'écran (tâche 29).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Cinq langues, celles de Langues.toutes (l'espagnol partout, l'arabe de Tunisie seulement, 17/11) ; un
        # téléphone dans une autre langue a l'anglais (LangueApp, Traducteur.langueDuTelephone, PORTAGE.md § 2.2.7).
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [fr, en, he, es, ar-TN]
        # La raison de l'appareil photo (la carte d'embarquement, VolVue) ; ses traductions sont dans
        # Chaines/InfoPlist.xcstrings, compilé avec les autres catalogues (Catalogue/).
        NSCameraUsageDescription: "The camera reads the barcode of your boarding pass, on the phone: nothing is sent."
        # Le verrou du journal (VerrouJournal, App/Services/CodeDuTelephone.swift) et la minuterie système (tâche 17,
        # App/Services/Minuterie.swift) ; traduits de même dans Chaines/InfoPlist.xcstrings.
        NSFaceIDUsageDescription: "Face ID opens the journal when you have locked it."
        NSAlarmKitUsageDescription: "If you choose it in the settings, an alarm rings at the end of a timed hitbodedut, even when the phone is silent."
        # Les polices des textes saints, sous Polices/ dans le paquet (Vues/Polices.swift, Polices.fichiers).
        UIAppFonts:
          - Polices/hebreu_serif_regular.ttf
          - Polices/hebreu_serif_bold.ttf
          - Polices/varela_round.ttf
          - Polices/frank_ruhl.ttf
          - Polices/david_libre.ttf
          - Polices/noto_rashi.ttf
          - Polices/miriam_libre.ttf
          # Celles des accueils des versions (Polices.fichiersVersions).
          - Polices/bellefair.ttf
          - Polices/heebo.ttf
          - Polices/secular_one.ttf
          - Polices/rubik.ttf

targets:
  # L'audit d'accessibilité d'Xcode sur chaque écran (UITests/, tâche 29), ouvert par « -capture » (App/Captures.swift).
  MyHitbodedutUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: MyHitbodedut
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myhitbodedut.uitests
        GENERATE_INFOPLIST_FILE: YES
        # XCTest et ses fermetures d'audit, sans le contrôle strict de Swift 6 : un test, pas du code livré.
        SWIFT_VERSION: "5.0"

  # Les widgets (tâche 25) et la Live Activity de la séance (tâche 17). Ils lisent le journal et les réglages dans le
  # conteneur du groupe d'apps (Depot), calculent comme l'app (Coeur), traduisent avec ses catalogues (Chaines/), et
  # prennent les couleurs choisies dans palettes.json.
  Widgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - path: Ressources/Chaines
        type: folder
      - path: Ressources/Contenu/palettes.json
        buildPhase: resources
    dependencies:
      - package: Coeur
        products:
          - Coeur
          - Ecrans
      # Les boutons « Terminer maintenant » (TerminerSeanceIntent) : l'extraction des métadonnées d'AppIntents le veut.
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myhitbodedut.widgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: MyHitbodedut
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [fr, en, he, es, ar-TN]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.myhitbodedut]
