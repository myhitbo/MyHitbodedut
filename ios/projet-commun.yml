# Partie commune aux deux projets engendrés par XcodeGen 2.46.0 (PORTAGE.md § 5.3, § 7.1) :
#   project.yml                → l'app, les widgets et les trois extensions de la barrière ;
#   project-sans-barriere.yml  → l'app et les widgets seuls, pour TestFlight tant qu'Apple n'a pas
#                                accordé Family Controls en distribution (décision D3).
# Le projet Xcode n'est jamais versionné : xcodegen generate --spec project.yml

name: MyHitbodedut

options:
  bundleIdPrefix: com.myhitbodedut
  deploymentTarget:
    iOS: "26.5"          # décision D2
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"   # iPhone d'abord ; l'iPad à la tâche 29
    DEVELOPMENT_TEAM: ""          # posé par la signature (Codemagic, P1 et P2)
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Coeur:
    path: Paquets/Coeur

targetTemplates:
  App:
    type: application
    platform: iOS
    sources:
      - App
      # Les ressources exportées par tools/export_contenu (PORTAGE.md § 4.2), en dossiers : le paquet de l'app
      # garde leur arborescence (Contenu/livres/<id>/…, Images/<nom>.webp, Polices/licences/…).
      - path: Ressources/Contenu
        type: folder
      - path: Ressources/Images
        type: folder
      - path: Ressources/Polices
        type: folder
      - path: Ressources/Musique
        type: folder
      # Les catalogues de chaînes, compilés pour Text("clé") ; XcodeGen y lit les langues du projet.
      - path: Ressources/Chaines
        includes: ["*.xcstrings"]
      # Les mêmes fichiers tels quels, sous Chaines/ : le Traducteur d'Ecrans lit le JSON du catalogue, les
      # écrans les tableaux de chaînes (Tableaux.json).
      - path: Ressources/Chaines
        type: folder
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myhitbodedut
        PRODUCT_NAME: MyHitbodedut
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MyHitbodedut
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Trois langues ; un téléphone dans une autre langue a l'anglais (LangueApp, PORTAGE.md § 2.2.7).
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [fr, en, he]
        # Les polices des textes saints, sous Polices/ dans le paquet (Vues/Polices.swift, Polices.fichiers).
        UIAppFonts:
          - Polices/hebreu_serif_regular.ttf
          - Polices/hebreu_serif_bold.ttf
          - Polices/varela_round.ttf
          - Polices/frank_ruhl.ttf
          - Polices/david_libre.ttf
          - Polices/noto_rashi.ttf
          - Polices/miriam_libre.ttf

targets:
  Widgets:
    type: app-extension
    platform: iOS
    sources: [Widgets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myhitbodedut.widgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: MyHitbodedut
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.myhitbodedut]
