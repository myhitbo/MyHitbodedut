name: iOS (oracle JVM)

# Le code Kotlin de l'app, exécuté sur la JVM seule, répond aux questions que les tests Swift de
# Coeur rejouent (tools/vecteurs_ios ; ios/ROADMAP.md tâche 7). Ses réponses sont versionnées dans
# ios/Paquets/Coeur/Tests/Vecteurs, avec le fichier d'or du site : ce flux les refait et échoue si
# elles ont changé, c'est-à-dire si une règle d'Android ou du site a bougé sans qu'iOS suive.
# Repris de la PR #29. Budget (décision D5) : Linux seulement, un travail, quand ces fichiers bougent.

on:
  push:
    paths:
      - 'tools/vecteurs_ios/**'
      - 'ios/Paquets/Coeur/Tests/Vecteurs/**'
      - '.github/workflows/ios-oracle.yml'
      # Ce que l'oracle compile et lit d'Android, et ce que le fichier d'or du site exécute.
      - 'android/app/src/main/java/com/myhitbodedut/**'
      - 'android/app/src/main/res/values*/strings.xml'
      - 'android/app/src/main/res/raw/*.json'
      - 'web/src/js/**'
      - 'web/vendor/**'
      - 'web/test/vecteur_coffre.json'
  pull_request:
    paths:
      - 'tools/vecteurs_ios/**'
      - 'ios/Paquets/Coeur/Tests/Vecteurs/**'
      - '.github/workflows/ios-oracle.yml'
      - 'android/app/src/main/java/com/myhitbodedut/**'
      - 'android/app/src/main/res/values*/strings.xml'
      - 'android/app/src/main/res/raw/*.json'
      - 'web/src/js/**'
      - 'web/vendor/**'
      - 'web/test/vecteur_coffre.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  vecteurs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Java 21, comme là où les vecteurs sont produits : d'une version à l'autre, Java n'écrit pas
      # les nombres ni ne lit les expressions régulières tout à fait de même.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: android.jar (plateforme 36), gardé d'une fois sur l'autre
        uses: actions/cache@v4
        with:
          path: tools/vecteurs_ios/build/android-36
          key: oracle-android-36-r02-${{ hashFiles('tools/vecteurs_ios/build.gradle.kts') }}
      - name: Vecteurs refaits par le code d'Android et du site
        run: tools/vecteurs_ios/lancer.sh
      - name: Garde de dérive
        run: |
          if [ -n "$(git status --porcelain -- ios/Paquets/Coeur/Tests/Vecteurs)" ]; then
            git status --short -- ios/Paquets/Coeur/Tests/Vecteurs
            git --no-pager diff --stat -- ios/Paquets/Coeur/Tests/Vecteurs
            echo "::error::Les réponses d'Android ou du site ont changé : relancer tools/vecteurs_ios/lancer.sh, versionner ios/Paquets/Coeur/Tests/Vecteurs et faire suivre les tests de Coeur."
            exit 1
          fi
      # Deux passes donnent les mêmes octets.
      - name: Une seconde passe ne change rien
        run: |
          tools/vecteurs_ios/lancer.sh
          git diff --exit-code -- ios/Paquets/Coeur/Tests/Vecteurs
