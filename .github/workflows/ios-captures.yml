name: iOS (captures, macOS)

# L'app lancée pour de vrai sur le simulateur, et photographiée : chaque écran principal dans les cinq langues
# (fr, en, he, es, ar-TN), puis quelques-uns en mode sombre, aux grandes tailles de texte d'accessibilité et sur
# iPad (tâche 29). L'app ouvre l'écran demandé d'elle-même sur un journal de démonstration (« -capture <écran>
# -captureDemo », ios/App/Captures.swift) ; tools/captures_ios/capturer.sh la lance, photographie et relève les
# plantages. Les captures (JPEG réduits) sont dans l'artefact « captures-ios » ; les plantages dans le résumé.
# Lancé à la main seulement (« Run workflow », ou l'API workflow_dispatch : de quarante minutes à deux heures de
# macOS selon les langues et les passes demandées), jamais à chaque envoi. Même runner et même Xcode qu'ios-app.yml.

on:
  workflow_dispatch:
    inputs:
      langues:
        description: 'Langues (fr en he es ar-TN)'
        required: false
        default: 'fr en he es ar-TN'
      ecrans:
        description: 'Écrans (vide : tous ceux de Captures.swift)'
        required: false
        default: ''
      passes:
        description: 'Passes (iphone sombre grand ipad paysage)'
        required: false
        default: 'iphone sombre grand ipad paysage'
      audit:
        description: "Audit d'accessibilité (oui, non)"
        required: false
        default: 'oui'

permissions:
  contents: read

# Une passe lancée à la main ne remplace que la même passe (mêmes langues, mêmes passes) : on peut partager une
# capture complète entre plusieurs travaux qui tournent ensemble.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.langues }}-${{ inputs.passes }}-${{ inputs.ecrans }}
  cancel-in-progress: true

jobs:
  captures:
    runs-on: macos-26-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: Contenus exportés
        run: python3 tools/export_contenu/export.py
      - name: Projet Xcode (XcodeGen)
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate --spec project.yml
      - name: Compilation de l'app (simulateur, sans signature)
        run: |
          set -o pipefail
          xcodebuild -project ios/MyHitbodedut.xcodeproj -scheme MyHitbodedut -configuration Debug \
            -destination "generic/platform=iOS Simulator" -derivedDataPath "$RUNNER_TEMP/app" \
            ARCHS=x86_64 CODE_SIGNING_ALLOWED=NO build 2>&1 | tee app.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" app.log
      - name: Captures
        env:
          APP: ${{ runner.temp }}/app/Build/Products/Debug-iphonesimulator/MyHitbodedut.app
          SORTIE: captures
          LANGUES: ${{ inputs.langues || 'fr en he es ar-TN' }}
          ECRANS: ${{ inputs.ecrans }}
          PASSES: ${{ inputs.passes || 'iphone sombre grand ipad paysage' }}
        run: |
          RESUME="$GITHUB_STEP_SUMMARY" bash tools/captures_ios/capturer.sh
      # Les captures, dès qu'elles sont faites : un artefact v4 se télécharge avant la fin du travail.
      - name: Captures et journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-ios
          path: |
            captures/jpg
            captures/journaux
            app.log
          retention-days: 14
          if-no-files-found: ignore
      # L'audit d'accessibilité d'Xcode sur chaque écran, en français (ios/UITests, tâche 29), sorte par sorte : la
      # liste des défauts dans le résumé, et le travail échoue au premier défaut qui n'est pas un faux positif connu
      # (AuditAccessibiliteTests.tolerance, chacun avec sa raison, et la liste « Tolérés » du résumé). Pour relever
      # sans échouer : TEST_RUNNER_AUDIT_RELEVE: '1'.
      - name: Audit d'accessibilité (XCUITest)
        if: ${{ !cancelled() && hashFiles('captures/iphone.txt') != '' && (inputs.audit || 'oui') == 'oui' }}
        env:
          TEST_RUNNER_AUDIT_LANGUE: fr
          TEST_RUNNER_AUDIT_ECRANS: ${{ inputs.ecrans }}
        run: |
          set -o pipefail
          xcodebuild test -project ios/MyHitbodedut.xcodeproj -scheme MyHitbodedut -destination "id=$(cat captures/iphone.txt)" \
            -derivedDataPath "$RUNNER_TEMP/app" ARCHS=x86_64 CODE_SIGNING_ALLOWED=NO \
            -only-testing:MyHitbodedutUITests 2>&1 | tee audit.log | grep -E "^AUDIT|error:|TEST (SUCCEEDED|FAILED)" || true
          n=$(grep -c "^AUDIT" audit.log || true)
          t=$(grep -c "^TOLERE" audit.log || true)
          {
            echo "## Audit d'accessibilité : $n défaut(s)"
            echo '```'
            grep "^AUDIT" audit.log | cut -f2- | sort | head -400
            echo '```'
            # Les faux positifs connus (AuditAccessibiliteTests.toleres), chacun avec sa raison ; les audits refaits
            # sorte par sorte faute d'avoir fini à temps.
            echo "### Tolérés : $t"
            echo '```'
            grep "^TOLERE" audit.log | cut -f2- | sort | head -100
            echo '```'
            echo "### Refaits sorte par sorte : $(grep -c '^LENT' audit.log || true)"
            echo '```'
            grep "^LENT" audit.log | cut -f2,3 | sort | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -q "TEST SUCCEEDED" audit.log
      # Les écrans couchés, sur l'iPhone puis l'iPad de la passe « paysage » : le test d'interface tourne l'appareil
      # (XCUIDevice), ce que simctl ne sait pas faire, et pose ses images dans captures/couchees.
      - name: Captures couchées (XCUITest)
        if: ${{ !cancelled() && hashFiles('captures/iphone.txt') != '' && contains(inputs.passes || 'paysage', 'paysage') }}
        continue-on-error: true
        env:
          TEST_RUNNER_CAPTURES_COUCHEES: ${{ github.workspace }}/captures/couchees
          TEST_RUNNER_CAPTURES_LANGUES: fr he
        run: |
          couchees() {
            TEST_RUNNER_CAPTURES_PREFIXE=$2 xcodebuild test -project ios/MyHitbodedut.xcodeproj -scheme MyHitbodedut \
              -destination "id=$1" -derivedDataPath "$RUNNER_TEMP/app" ARCHS=x86_64 CODE_SIGNING_ALLOWED=NO \
              -only-testing:MyHitbodedutUITests/AuditAccessibiliteTests/testCapturesCouchees 2>&1 \
              | tee -a couchees.log | grep -E "error:|TEST (SUCCEEDED|FAILED)" || true
          }
          # L'iPad d'abord, déjà démarré par le script ; puis l'iPhone, que le script avait éteint et qu'il faut
          # redémarrer avant le test (sans quoi xcodebuild attend dix minutes et abandonne, le 23/11).
          if [ -f captures/ipad.txt ]; then
            couchees "$(cat captures/ipad.txt)" paysage-ipad
            xcrun simctl shutdown "$(cat captures/ipad.txt)" || true
          fi
          xcrun simctl boot "$(cat captures/iphone.txt)" || true
          xcrun simctl bootstatus "$(cat captures/iphone.txt)" -b >/dev/null
          couchees "$(cat captures/iphone.txt)" paysage-iphone
          mkdir -p captures/couchees-jpg
          for f in captures/couchees/*.png; do
            test -f "$f" || continue
            # L'image de l'écran est celle de l'appareil debout : tournée d'un quart de tour, elle se lit couchée.
            sips -r 270 -Z 1400 -s format jpeg -s formatOptions 70 "$f" \
              --out "captures/couchees-jpg/$(basename "${f%.png}").jpg" >/dev/null
          done
          echo "## Captures couchées : $(ls captures/couchees-jpg | wc -l | tr -d ' ')" >> "$GITHUB_STEP_SUMMARY"
      - name: Captures couchées et leur journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-couchees-ios
          path: |
            captures/couchees-jpg
            couchees.log
          retention-days: 14
          if-no-files-found: ignore
      - name: Journal de l'audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-ios
          path: audit.log
          retention-days: 14
          if-no-files-found: ignore
