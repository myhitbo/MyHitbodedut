name: iOS (cœur, Linux)

# Le paquet Swift « Coeur » de la version iOS, compilé et testé sous Linux, sans Mac
# (ios/PORTAGE.md § 7.2, ios/ROADMAP.md tâches 1 et 5). Un envoi qui ne touche que le code
# d'Android ne le déclenche pas ; ses contenus, que l'export lit, si.
# Budget (décision D5) : Linux seulement ici, aucune minute macOS.

on:
  push:
    paths:
      - 'ios/**'
      - 'tools/export_contenu/**'
      - 'web/test/vecteurs_*'
      - '.github/workflows/ios-coeur.yml'
      # Les contenus d'Android que l'export lit (tâche 5) : un changement doit suivre dans le manifeste.
      - 'android/app/src/main/res/raw/**'
      - 'android/app/src/main/res/values*/strings.xml'
      - 'android/app/src/main/res/values*/colors.xml'
      - 'android/app/src/main/res/values*/palettes.xml'
      - 'android/app/src/main/res/drawable*/**'
      - 'android/app/src/main/res/font/**'
      - 'android/app/src/main/assets/licences/**'
      - 'android/app/src/main/java/com/myhitbodedut/MusiquePlay.kt'
      - 'android/app/src/test/resources/zmanim_reference_*'
      # Ce que les tests de données lisent en place : la source des livres, la musique hors des apps.
      - 'android/app/src/main/livres/**'
      - 'android/app/src/musique_hors_play/res/raw/**'
      - 'musique/**'
  pull_request:
    paths:
      - 'ios/**'
      - 'tools/export_contenu/**'
      - 'web/test/vecteurs_*'
      - '.github/workflows/ios-coeur.yml'
      # Les contenus d'Android que l'export lit (tâche 5) : un changement doit suivre dans le manifeste.
      - 'android/app/src/main/res/raw/**'
      - 'android/app/src/main/res/values*/strings.xml'
      - 'android/app/src/main/res/values*/colors.xml'
      - 'android/app/src/main/res/values*/palettes.xml'
      - 'android/app/src/main/res/drawable*/**'
      - 'android/app/src/main/res/font/**'
      - 'android/app/src/main/assets/licences/**'
      - 'android/app/src/main/java/com/myhitbodedut/MusiquePlay.kt'
      - 'android/app/src/test/resources/zmanim_reference_*'
      # Ce que les tests de données lisent en place : la source des livres, la musique hors des apps.
      - 'android/app/src/main/livres/**'
      - 'android/app/src/musique_hors_play/res/raw/**'
      - 'musique/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # La garde de dérive (PORTAGE.md § 4.2) : l'export relit les contenus d'Android et échoue,
  # en nommant les fichiers, si ios/Ressources/MANIFESTE.json ne suit pas.
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Export des contenus et garde de dérive
        run: python3 tools/export_contenu/export.py --verifier
      - name: Un second export donne le même manifeste
        run: python3 tools/export_contenu/export.py --verifier

  coeur:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Swift 6.2, celui de Xcode 26 (§ 7.7).
    container: swift:6.2-noble
    # Le cœur sans les vues : un papier en chantier ne bloque pas le jugement des règles.
    env:
      COEUR_SANS_VUES: "1"
    defaults:
      run:
        shell: bash
        working-directory: ios/Paquets/Coeur
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: swift --version
      # Les tests de données lisent ios/Ressources/Contenu : l'export d'abord.
      - name: Contenus exportés
        working-directory: ${{ github.workspace }}
        run: |
          command -v python3 >/dev/null || { apt-get update -qq && apt-get install -y -qq python3 >/dev/null; }
          python3 tools/export_contenu/export.py
      # -warnings-as-errors n'est pas passé à swiftc : SwiftPM le donnerait aussi à KosherSwift,
      # dont il tait les avertissements (-suppress-warnings), et les deux options se contredisent.
      # Les avertissements de Coeur et de ses tests sont donc cherchés dans le journal.
      - name: Construction (aucun avertissement dans Coeur, Barriere ni Ecrans)
        run: |
          swift build --build-tests 2>&1 | tee construction.log
          if grep -E '/(Sources/(Coeur|Barriere|Ecrans|Vues|SwiftUIDePapier)|Tests/(CoeurTests|BarriereTests|EcransTests))/[^:]+:[0-9]+:[0-9]+: warning:' construction.log; then
            echo "::error::avertissements dans le paquet Coeur"
            exit 1
          fi
      - name: Tests
        run: swift test --skip-build

  # Les vues SwiftUI de l'app (cible Vues), type-checkées contre SwiftUI de papier : des signatures d'Apple
  # sans rendu (tools/swiftui_papier). Sur iPhone, les mêmes fichiers importent le vrai SwiftUI.
  vues:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: swift:6.2-noble
    defaults:
      run:
        shell: bash
        working-directory: ios/Paquets/Coeur
    steps:
      - uses: actions/checkout@v4
      - name: Construction des vues (aucun avertissement dans Vues ni dans le papier)
        run: |
          swift build --target Vues 2>&1 | tee vues.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E '/Sources/(Vues|SwiftUIDePapier)/[^:]+:[0-9]+:[0-9]+: warning:' vues.log; then
            echo "::error::avertissements dans les vues"
            exit 1
          fi
