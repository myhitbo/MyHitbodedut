name: iOS (cœur, Linux)

# Le paquet Swift « Coeur » de la version iOS, compilé et testé sous Linux, sans Mac
# (ios/PORTAGE.md § 7.2, ios/ROADMAP.md tâche 1). Un envoi qui ne touche que android/
# ne le déclenche pas ; les contenus d'Android s'ajouteront aux chemins avec leur export (tâche 5).
# Budget (décision D5) : Linux seulement ici, aucune minute macOS.

on:
  push:
    paths:
      - 'ios/**'
      - 'tools/export_contenu/**'
      - 'web/test/vecteurs_*'
      - '.github/workflows/ios-coeur.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'tools/export_contenu/**'
      - 'web/test/vecteurs_*'
      - '.github/workflows/ios-coeur.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  coeur:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Swift 6.2, celui de Xcode 26 (§ 7.7).
    container: swift:6.2-noble
    defaults:
      run:
        shell: bash
        working-directory: ios/Paquets/Coeur
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: swift --version
      # -warnings-as-errors n'est pas passé à swiftc : SwiftPM le donnerait aussi à KosherSwift,
      # dont il tait les avertissements (-suppress-warnings), et les deux options se contredisent.
      # Les avertissements de Coeur et de ses tests sont donc cherchés dans le journal.
      - name: Construction (aucun avertissement dans Coeur)
        run: |
          swift build --build-tests 2>&1 | tee construction.log
          if grep -E '/(Sources/Coeur|Tests/CoeurTests)/[^:]+:[0-9]+:[0-9]+: warning:' construction.log; then
            echo "::error::avertissements dans le paquet Coeur"
            exit 1
          fi
      - name: Tests
        run: swift test --skip-build
