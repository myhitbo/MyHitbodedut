name: Vérification des secrets

# Dit quel secret manque ou ne va pas, sans jamais en afficher la valeur (17/11) :
# présence de chacun, clés Play et GitHub (mot de passe, alias, mot de passe de la clé,
# empreinte publique), jeton Cloudflare (valide ? même compte ? droit sur Pages ?).
# Lancé à la main, ou par une PR qui modifie ce fichier.
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/verif-secrets.yml']

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Secrets
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          ok() { echo "OK      $*"; }
          ko() { echo "PROBLÈME $*"; echo "::error::$*"; }

          echo "=== Présence ==="
          for n in PLAY_KEYSTORE_BASE64 PLAY_KEYSTORE_PASSWORD PLAY_KEY_ALIAS PLAY_KEY_PASSWORD \
                   RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD \
                   CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            v="${!n}"
            if [ -z "$v" ]; then ko "$n : absent (ou vide)"
            else
              # Un espace ou un retour à la ligne collé avec la valeur la fausse sans qu'on le voie.
              if [ "$v" != "$(printf '%s' "$v" | tr -d '[:space:]')" ] && [[ "$n" != *PASSWORD ]]; then
                ko "$n : présent, mais contient des espaces ou des retours à la ligne"
              else ok "$n : présent (${#v} caractères)"; fi
            fi
          done

          cle() { # préfixe
            local b64="${1}_KEYSTORE_BASE64" sp="${1}_KEYSTORE_PASSWORD" al="${1}_KEY_ALIAS" kp="${1}_KEY_PASSWORD"
            echo; echo "=== Clé $1 ==="
            [ -n "${!b64}" ] || { ko "$1 : pas de fichier de clé ($b64), rien d'autre à vérifier"; return; }
            f="$RUNNER_TEMP/$1.jks"
            if ! printf '%s' "${!b64}" | tr -d '[:space:]' | base64 -d > "$f" 2>/dev/null || [ ! -s "$f" ]; then
              ko "$b64 : ce n'est pas du base64 valide (contenu du fichier .txt mal copié ?)"; return
            fi
            ok "$b64 : se décode ($(stat -c %s "$f") octets)"
            if ! keytool -list -keystore "$f" -storepass "${!sp}" >/dev/null 2>&1; then
              ko "$sp : mauvais mot de passe pour ce fichier de clé (ou fichier abîmé)"; return
            fi
            ok "$sp : ouvre le fichier de clé"
            alias_trouves=$(keytool -list -keystore "$f" -storepass "${!sp}" 2>/dev/null | grep -i 'PrivateKeyEntry' | cut -d, -f1 | tr '\n' ' ')
            if ! keytool -list -keystore "$f" -storepass "${!sp}" -alias "${!al}" >/dev/null 2>&1; then
              ko "$al : l'alias saisi n'existe pas dans la clé ; alias présent(s) : $alias_trouves"; return
            fi
            ok "$al : l'alias existe"
            kpv="${!kp:-${!sp}}"
            if ! keytool -certreq -keystore "$f" -storepass "${!sp}" -alias "${!al}" -keypass "$kpv" -file /dev/null >/dev/null 2>&1; then
              ko "$kp : mauvais mot de passe de la clé (dans une clé créée par keytool, c'est le même que $sp)"; return
            fi
            ok "$kp : bon"
            echo "Empreinte SHA-256 (publique) : $(keytool -list -v -keystore "$f" -storepass "${!sp}" -alias "${!al}" 2>/dev/null | grep 'SHA256:' | awk '{print $2}')"
          }
          cle PLAY
          echo "(Empreinte attendue pour PLAY, play/A_FAIRE.md : E8:61:C4:49:…:67:B3)"
          cle RELEASE

          echo; echo "=== Cloudflare ==="
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            r=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
            # Un jeton créé dans « Account API tokens » appartient au compte : il se vérifie sous le compte.
            rc=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
            if [ "$(echo "$r" | jq -r '.success')" = "true" ]; then
              ok "CLOUDFLARE_API_TOKEN : jeton d'utilisateur valide, état $(echo "$r" | jq -r '.result.status')"
            elif [ "$(echo "$rc" | jq -r '.success')" = "true" ]; then
              ok "CLOUDFLARE_API_TOKEN : jeton de compte valide pour CLOUDFLARE_ACCOUNT_ID, état $(echo "$rc" | jq -r '.result.status')"
            else
              ko "CLOUDFLARE_API_TOKEN : jeton refusé par Cloudflare ($(echo "$r" | jq -c '[.errors[]?.message]')) — jeton mal copié, révoqué, ou c'est une « Global API Key » et non un « API Token »"
            fi
            comptes=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")
            n=$(echo "$comptes" | jq -r '.result | length' 2>/dev/null)
            echo "Comptes accessibles avec ce jeton : ${n:-0}"
            if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
              if echo "$comptes" | jq -e --arg id "$CLOUDFLARE_ACCOUNT_ID" '.result[]? | select(.id == $id)' >/dev/null \
                 || [ "$(echo "$rc" | jq -r '.success')" = "true" ]; then
                ok "CLOUDFLARE_ACCOUNT_ID : c'est bien un compte de ce jeton"
              else
                ko "CLOUDFLARE_ACCOUNT_ID : ne correspond à aucun compte de ce jeton (mauvais identifiant, ou jeton créé sur un autre compte ; longueur saisie : ${#CLOUDFLARE_ACCOUNT_ID}, attendue : 32)"
              fi
              p=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")
              if [ "$(echo "$p" | jq -r '.success')" = "true" ]; then
                ok "Droit sur Cloudflare Pages : oui ($(echo "$p" | jq -r '.result | length') projet(s))"
              else
                ko "Droit sur Cloudflare Pages : non ($(echo "$p" | jq -c '[.errors[]? | "\(.code) \(.message)"]')) — le jeton doit avoir Account › Cloudflare Pages › Edit"
              fi
            fi
          fi
          exit 0
