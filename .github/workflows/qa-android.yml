# Recette visuelle avant Google Play (14/11, PUBLICATION_PLAY_STORE.md § 2.1 et § 8).
#
# Le parcours de captures (.github/captures) sur une matrice d'émulateurs, d'Android 13 à 16,
# sur la construction Play (-Pplay=true) telle qu'elle est publiée (release, R8). Chaque cible
# publie ses captures, son bilan (fautes.txt) et ses plantages sur une branche claude/qa-<nom>.
#
# Ce qu'il faut capturer est écrit dans .github/qa/demande.json : les cibles (niveau d'API, nom),
# le parcours (recette, fiche ou captures), ses passes ou ses étapes. Le flux part à la main, ou
# quand une poussée sur une branche claude/** modifie ce fichier : une session Claude ne peut pas
# lancer un flux à la main, elle peut pousser.
name: QA Android (émulateurs)

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/qa/demande.json']

permissions:
  contents: write

concurrency:
  group: qa-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    outputs:
      cibles: ${{ steps.demande.outputs.cibles }}
      variante: ${{ steps.demande.outputs.variante }}
      parcours: ${{ steps.demande.outputs.parcours }}
      passes: ${{ steps.demande.outputs.passes }}
      etapes: ${{ steps.demande.outputs.etapes }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the request
        id: demande
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open(".github/qa/demande.json"))
          variante = d.get("variante", "release")
          assert variante in ("release", "debug", "verifR8"), variante
          assert d.get("parcours", "recette") in ("recette", "fiche", "captures")
          print("cibles=" + json.dumps(d["cibles"]))
          print("variante=" + variante)
          print("parcours=" + d.get("parcours", "recette"))
          print("passes=" + d.get("passes", ""))
          print("etapes=" + d.get("etapes", ""))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android platform 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true

      # La construction Play, signée par la clé de développement : c'est le code et les
      # ressources de l'AAB, installables sur un émulateur.
      - name: Build the Play edition
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          case "${{ steps.demande.outputs.variante }}" in
            release) tache=:app:assembleFullRelease ;;
            verifR8) tache=:app:assembleFullVerifR8 ;;
            *) tache=:app:assembleFullDebug ;;
          esac
          ./gradlew --no-daemon -Pplay=true "$tache"
          ls -la app/build/outputs/apk/full/*/

      # Le cache, pas un artefact : le quota d'artefacts du compte est plein (android.yml).
      - name: Keep the APK for the emulators
        uses: actions/cache/save@v4
        with:
          path: android/app/build/outputs/apk/full
          key: qa-apk-${{ github.sha }}-${{ steps.demande.outputs.variante }}-${{ github.run_id }}

  captures:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        cible: ${{ fromJSON(needs.apk.outputs.cibles) }}
    steps:
      - uses: actions/checkout@v4

      # L'émulateur veut plus de 7 Go pour ses données ; le runner n'en laissait que 6.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules /usr/share/swift /usr/local/share/powershell
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Fetch the APK
        uses: actions/cache/restore@v4
        with:
          path: android/app/build/outputs/apk/full
          key: qa-apk-${{ github.sha }}-${{ needs.apk.outputs.variante }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Capture on Android API ${{ matrix.cible.api }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CAPTURES_PARCOURS: ${{ needs.apk.outputs.parcours }}
          CAPTURES_VARIANTE: ${{ needs.apk.outputs.variante }}
          CAPTURES_ETAPES: ${{ matrix.cible.etapes || needs.apk.outputs.etapes }}
          RECETTE_PASSES: ${{ matrix.cible.passes || needs.apk.outputs.passes }}
          FICHE_LANGUES: ${{ matrix.cible.langues || '' }}
        with:
          api-level: ${{ matrix.cible.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.cible.profil || 'pixel_6' }}
          cores: 4
          ram-size: 4096M
          disk-size: 6144M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/captures/captures.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.cible.nom }} (API ${{ matrix.cible.api }})"
            echo "Captures : $(ls out/*.png 2>/dev/null | wc -l)"
            echo
            echo '```'
            cat out/fautes.txt 2>/dev/null || echo "aucune faute relevée"
            echo '```'
            echo '```'
            head -60 out/plantages.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the captures to a branch
        if: always()
        env:
          JETON: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls out/* >/dev/null 2>&1 || exit 0
          rm -rf /tmp/pub && mkdir -p /tmp/pub && cp out/* /tmp/pub/
          cd /tmp/pub
          git init -q && git checkout -q -b pub
          git add .
          git -c user.name="captures" -c user.email="actions@github.com" commit -q -m "QA ${{ matrix.cible.nom }} (API ${{ matrix.cible.api }}) ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${JETON}@github.com/${GITHUB_REPOSITORY}.git" "pub:claude/qa-${{ matrix.cible.nom }}"
