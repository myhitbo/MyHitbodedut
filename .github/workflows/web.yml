name: Web (iPhone)

# La version web installable, construite depuis les ressources Android.
# Elle ne touche pas à l'application Android ni à ses versions : ce flux a
# sa propre construction, ses propres tests, et sa propre mise en ligne.

on:
  push:
    branches: [main, claude/version-web]
    paths:
      - 'web/**'
      - 'android/app/src/main/res/**'
      - 'android/app/src/main/java/com/myhitbodedut/MusiquePlay.kt'
      - 'android/app/src/main/java/com/myhitbodedut/Zmanim.kt'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'android/app/src/main/res/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  # Écriture : pour la branche des captures seulement.
  contents: write

# Un run en cours va à son terme ; une poussée arrivée pendant ce temps attend, et seule la
# dernière en attente passe ensuite (02/11). Annuler le run en cours, comme avant, empêchait
# toute mise en ligne quand plusieurs commits arrivaient à moins de 30 min l'un de l'autre :
# rien n'avait été déployé de la journée.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      # Les captures « toutes tailles » ont rempli le disque du runner le 14/11 (ENOSPC) : la mise
      # en ligne a été sautée. On retire d'abord les SDK préinstallés dont ce flux ne se sert pas.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      # Hebcal, moteur de comparaison des tests du calendrier : dépendance de
      # test seulement (licence GPL), jamais copiée dans le site construit.
      - name: Test dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Unit tests (rules ported from Android)
        working-directory: web
        run: node --test test/*.test.mjs

      - name: Build
        working-directory: web
        run: node build.mjs

      # Les textes hébreux et leurs traductions ont été vérifiés un par un :
      # le site doit servir exactement les mêmes octets.
      - name: Verified texts are served unchanged
        run: |
          for f in chizuk.json bibliotheque.json tikkun_haklali.json villes.json siddur_annotations.json; do
            cmp "android/app/src/main/res/raw/$f" "web/dist/data/$f"
          done

      - name: Install browsers
        working-directory: web
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit

      # WebKit est le moteur de Safari : c'est lui qui compte pour l'iPhone.
      - name: Screenshots and checks (WebKit, Chromium)
        working-directory: web
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/web/node_modules/playwright
        run: |
          node test/captures.mjs webkit captures
          node test/captures.mjs chromium captures
          # Le plus petit téléphone courant (320×568) : rien ne déborde, « Commencer » se voit (15/10).
          LARGEUR=320 node test/captures.mjs chromium captures/petit

      # Chaque écran à chaque taille, du petit téléphone à l'ordinateur :
      # aucun débordement, et les onglets en bas ou sur le côté selon la largeur.
      # WebKit pour Safari (iPhone, iPad), Chromium pour Android et l'ordinateur.
      - name: Every screen at every size (WebKit, Chromium)
        working-directory: web
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/web/node_modules/playwright
        run: |
          node test/tailles.mjs webkit captures/tailles
          node test/tailles.mjs chromium captures/tailles

      # Le quota d'artefacts du compte est plein (voir android.yml) : les
      # captures partent sur une branche à part, remplacée à chaque fois.
      - name: Publish screenshots to the captures branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d web/captures ] || exit 0
          cd web/captures
          git init -q -b captures
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Captures linux du commit ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" captures:claude/captures-linux

      # Mise en ligne sur Cloudflare Pages (13/11) : le compte GitHub est passé de hil123 à
      # myhitbo et le dépôt du site est devenu privé, que GitHub Pages ne sert pas sur un compte
      # gratuit. Cloudflare Pages sert web/dist directement, sans dépôt public intermédiaire.
      # L'adresse https://myhitbodedut.pages.dev/ est celle des règles de confidentialité
      # saisie dans Google Play : CelebrationActivity.LIEN_WEB et app.js LIEN_WEB la répètent,
      # ConfidentialiteTest la tient. Changer CLOUDFLARE_PROJET change l'adresse : mettre les trois
      # à jour ensemble.
      # Sans les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID, l'étape ne fait rien.
      - name: Deploy to Cloudflare Pages
        # Seule main met en ligne : une poussée sur une vieille branche de travail écraserait le site.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJET: myhitbodedut
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Pas de secrets Cloudflare : site construit et testé, non mis en ligne."
            exit 0
          fi
          # Cloudflare refuse tout fichier de plus de 25 Mio : le dire clairement plutôt qu'à mi-envoi.
          gros=$(find web/dist -type f -size +25M)
          if [ -n "$gros" ]; then echo "Fichiers trop gros pour Cloudflare Pages :"; echo "$gros"; exit 1; fi
          # Crée le projet au premier passage ; ensuite la commande échoue sans conséquence.
          npx --yes wrangler@3 pages project create "$CLOUDFLARE_PROJET" --production-branch=main || true
          npx --yes wrangler@3 pages deploy web/dist --project-name="$CLOUDFLARE_PROJET" --branch=main --commit-dirty=true
          echo "En ligne : https://${CLOUDFLARE_PROJET}.pages.dev/ (version $(cat web/dist/version.txt))"

      # Copie du site en ligne dans le dépôt myhitbodedut-web (22/11), pour qu'il reste identique
      # à Cloudflare Pages. Vient après la mise en ligne et ne la bloque jamais : si la copie
      # échoue, le site reste en ligne. Un seul commit, remplacé à chaque fois : la musique
      # (~65 Mo) ne s'empile pas d'une version à l'autre dans l'historique.
      # Le jeton GitHub du flux ne peut pas écrire dans un autre dépôt : il faut le secret
      # WEB_DEPLOY_TOKEN (jeton à accès fin, dépôt myhitbodedut-web, permission Contents en écriture).
      # Sans lui, l'étape ne fait rien.
      - name: Copy the site to the myhitbodedut-web repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.WEB_DEPLOY_TOKEN }}
          CIBLE: myhitbo/myhitbodedut-web
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Pas de secret WEB_DEPLOY_TOKEN : dépôt $CIBLE non mis à jour."
            exit 0
          fi
          cd web/dist
          touch .nojekyll
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site construit depuis ${GITHUB_SHA} (main), identique à Cloudflare Pages (version $(cat version.txt))"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${CIBLE}.git" main
          rm -rf .git
          echo "Dépôt $CIBLE à jour (version $(cat version.txt))"
